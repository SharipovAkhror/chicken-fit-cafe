name: Supabase Keep-Alive Ping

on:
  schedule:
    # Запуск каждый день в 05:00 UTC (10:00 утра по Ташкенту/Самарканду)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          echo "Pinging Supabase at https://ikvontqurgzopdmsdmla.supabase.co..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrdm9udHF1cmd6b3BkbXNkbWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzgzNzIsImV4cCI6MjEwMjI1NDM3Mn0.URw3FfSKNXm1LdXtf6rCUQL-EITRObj-zd5oJmQFqq0' }}" \
            "https://ikvontqurgzopdmsdmla.supabase.co/rest/v1/categories?select=id&limit=1")
          echo "Supabase direct HTTP Status: $HTTP_STATUS"

          echo "Pinging Production Keep-Alive API..."
          VERCEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://chicken-fit-cafe.vercel.app/api/keepalive")
          echo "Vercel API HTTP Status: $VERCEL_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$VERCEL_STATUS" -eq 200 ]; then
            echo "✅ Supabase is alive and active! Auto-pause prevented."
          else
            echo "⚠️ Warning: Check response codes ($HTTP_STATUS / $VERCEL_STATUS)"
          fi
