  <rect width="128" height="128" fill="#FDFCF9"/>
  <!-- shadow -->
  <ellipse cx="64" cy="108" rx="36" ry="6" fill="#E8E0D4"/>
  <!-- body wrap left -->
  <path fill="#E8D4B0" d="M30 48c-4 8-4 28 2 42 6 14 20 22 36 20 4-20 6-40 4-58-12 2-28 2-42-4z"/>
  <!-- open mouth of wrap -->
  <path fill="#F5E6D0" d="M40 44c12-8 36-10 52 0 4 8 2 20-4 28L70 88c-8 4-20 4-28 0-8-6-10-18-2-44z"/>
  <!-- layers inside -->
  <path fill="#C95530" d="M48 52h32v8H48z"/>
  <path fill="#28211D" d="M46 60h36v14H46z"/>
  <path fill="none" stroke="#F5E6D0" stroke-width="1.1" opacity=".45" d="M52 64h24M50 70h28"/>
  <path fill="#667447" d="M48 74c6-4 12 0 16-2s12 2 16 0v6c-4 2-10-2-16 0s-12 2-16-2z"/>
  <path fill="#C95530" d="M50 80h28v8H50z"/>
  <!-- right pastry flap folded -->
  <path fill="#D4BC94" d="M88 46c10 4 16 16 12 32-4 12-14 20-26 20 4-16 6-32 4-48 4 0 8-2 10-4z"/>
  <path fill="none" stroke="#C4A878" stroke-width="1.4" d="M92 56c-4 8-6 18-6 28M96 68c-4 6-6 14-6 22"/>
  <!-- sesame-like crust dots -->
  <circle cx="44" cy="90" r="2" fill="#C4A878"/>
  <circle cx="56" cy="96" r="1.8" fill="#C4A878"/>
  <circle cx="78" cy="52" r="1.6" fill="#C4A878"/>
</svg>
