<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="ChickenFit">
  <title>ChickenFit — primary wordmark</title>
  <desc>Словесный знак ChickenFit: Chicken графит, Fit терракота, модуль из трёх слоёв слева. Финальная обводка шрифта Unbounded — после лицензии.</desc>
  <g fill="#B94D2F">
    <rect x="8" y="42" width="72" height="10" rx="5"/>
    <rect x="16" y="60" width="72" height="10" rx="5"/>
    <rect x="4" y="78" width="72" height="10" rx="5"/>
  </g>
  <text x="100" y="90" font-family="Unbounded, Arial Black, Impact, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#28211D">Chicken</tspan><tspan fill="#B94D2F">Fit</tspan>
  </text>
</svg>
