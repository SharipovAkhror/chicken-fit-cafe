<?xml version="1.0" encoding="UTF-8"?>
<!--
  HERO poster chicken — NOT logo mark language.
  Goal: 0.3s = «это сочная курица» — bone knuckle, crispy crust, meat fibers,
  juice sheen, portion stack. Vector appetite illustration for facade banner.
  Style: premium QSR food-art (Popeyes/product boards method) + JP restraint on colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="Hero juicy fried chicken for poster">
  <defs>
    <linearGradient id="crustGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A52"/>
      <stop offset="35%" stop-color="#C95530"/>
      <stop offset="70%" stop-color="#A34428"/>
      <stop offset="100%" stop-color="#7A3018"/>
    </linearGradient>
    <linearGradient id="crustLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F0A070"/>
      <stop offset="50%" stop-color="#D96A42"/>
      <stop offset="100%" stop-color="#B84A2A"/>
    </linearGradient>
    <linearGradient id="meatInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D0"/>
      <stop offset="40%" stop-color="#E8D4B8"/>
      <stop offset="100%" stop-color="#D4B896"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="50%" stop-color="#F0E4D0"/>
      <stop offset="100%" stop-color="#D8CBB4"/>
    </linearGradient>
    <radialGradient id="juiceSheen" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFD4B0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#C95530" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#28211D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="800" fill="#FFFFFF"/>

  <!-- ground shadow -->
  <ellipse cx="450" cy="720" rx="320" ry="48" fill="#E8E0D4" opacity="0.9"/>
  <ellipse cx="450" cy="708" rx="260" ry="32" fill="#F3EDE3"/>

  <g filter="url(#softShadow)">

  <!-- ========== DRUMSTICK BACK (left, darker, depth) ========== -->
  <g>
    <!-- meat body -->
    <path fill="url(#crustGold)" d="
      M 180 480
      C 120 400 130 280 200 220
      C 250 175 340 175 390 240
      C 430 290 430 380 390 460
      C 350 540 240 560 180 480
      Z"/>
    <!-- roasted deep side -->
    <path fill="#6B2810" fill-opacity="0.45" d="
      M 200 480
      C 180 420 190 340 230 290
      C 210 360 220 440 250 510
      C 270 540 300 550 320 540
      C 280 560 220 540 200 480
      Z"/>
    <!-- crispy edge bumps -->
    <path fill="#B84A2A" d="
      M 195 320 C 175 310 175 280 200 270 C 215 290 210 320 195 320 Z
      M 250 230 C 235 210 255 185 280 195 C 285 220 265 240 250 230 Z
      M 340 220 C 330 200 350 180 375 190 C 380 215 355 230 340 220 Z"/>
    <!-- crust crackle -->
    <g fill="none" stroke="#4A1C0C" stroke-linecap="round" stroke-opacity="0.35">
      <path stroke-width="3" d="M220 300 C270 270 330 280 370 330"/>
      <path stroke-width="2.5" d="M210 360 C270 330 340 345 380 395"/>
      <path stroke-width="2.8" d="M215 420 C280 390 340 410 370 455"/>
      <path stroke-width="2" d="M240 270 C290 250 340 265 365 300"/>
    </g>
    <!-- crust grain dots -->
    <g fill="#5C2010" fill-opacity="0.3">
      <circle cx="250" cy="320" r="3"/><circle cx="300" cy="350" r="2.5"/>
      <circle cx="280" cy="400" r="2.8"/><circle cx="330" cy="300" r="2.2"/>
      <circle cx="260" cy="450" r="2.4"/>
    </g>
    <!-- bone shaft + knuckle -->
    <path fill="url(#boneGrad)" d="
      M 360 470
      C 380 510 395 560 390 610
      C 385 650 355 665 335 645
      C 315 625 330 570 350 520
      C 355 500 358 480 360 470
      Z"/>
    <ellipse cx="355" cy="640" rx="32" ry="22" fill="#EDE3D0"/>
    <ellipse cx="355" cy="640" rx="18" ry="12" fill="#FFF8EC"/>
    <ellipse cx="355" cy="640" rx="7" ry="5" fill="#D4C4A8"/>
    <!-- bone shaft highlight -->
    <path fill="#FFF8EC" fill-opacity="0.5" d="
      M 365 500 C 372 540 375 580 370 610 C 365 580 362 540 365 500 Z"/>
  </g>

  <!-- ========== THIGH / BREAST HERO (center) ========== -->
  <g>
    <path fill="url(#crustLight)" d="
      M 300 500
      C 240 380 280 220 400 170
      C 500 130 620 170 660 290
      C 700 410 640 540 520 590
      C 420 630 340 600 300 500
      Z"/>
    <!-- deep belly shade -->
    <path fill="#6B2810" fill-opacity="0.4" d="
      M 340 520
      C 360 580 450 620 540 580
      C 500 630 400 640 340 580
      C 310 545 320 520 340 520
      Z"/>
    <!-- juicy highlight blob -->
    <ellipse cx="430" cy="280" rx="90" ry="55" fill="url(#juiceSheen)"/>
    <!-- specular arc -->
    <path fill="#FFD4B0" fill-opacity="0.45" d="
      M 380 220
      C 430 170 540 175 600 240
      C 540 200 450 200 390 245
      C 370 260 365 235 380 220
      Z"/>

    <!-- ===== MEAT FIBERS (obvious chicken) ===== -->
    <g fill="none" stroke="#6B2810" stroke-linecap="round">
      <!-- long fiber groups -->
      <path stroke-width="2.2" stroke-opacity="0.28" d="M340 300 C400 270 500 280 580 330"/>
      <path stroke-width="2" stroke-opacity="0.25" d="M330 340 C400 310 510 320 590 375"/>
      <path stroke-width="2.4" stroke-opacity="0.3" d="M335 385 C410 350 520 365 595 425"/>
      <path stroke-width="2" stroke-opacity="0.26" d="M345 430 C420 400 520 415 580 470"/>
      <path stroke-width="1.8" stroke-opacity="0.22" d="M360 470 C430 445 510 460 560 510"/>
      <!-- finer parallel fibers -->
      <path stroke-width="1.3" stroke-opacity="0.2" d="M350 320 C410 295 500 305 570 350"/>
      <path stroke-width="1.3" stroke-opacity="0.2" d="M345 360 C415 335 515 348 585 400"/>
      <path stroke-width="1.3" stroke-opacity="0.2" d="M350 405 C420 380 515 395 580 445"/>
      <path stroke-width="1.2" stroke-opacity="0.18" d="M370 250 C430 230 510 240 570 280"/>
      <path stroke-width="1.2" stroke-opacity="0.18" d="M380 280 C445 260 520 270 580 310"/>
    </g>

    <!-- crispy crackle network -->
    <g fill="none" stroke="#4A1C0C" stroke-linecap="round" stroke-opacity="0.32">
      <path stroke-width="3.2" d="M360 260 C430 230 530 245 610 300"/>
      <path stroke-width="2.6" d="M320 350 C410 310 530 330 630 400"/>
      <path stroke-width="2.8" d="M330 420 C420 380 530 400 610 470"/>
      <path stroke-width="2.2" d="M380 210 C460 185 550 200 620 250"/>
      <path stroke-width="2" d="M400 480 C470 460 540 480 590 530"/>
    </g>

    <!-- crust crumb flecks (хруст) -->
    <g fill="#5C2010" fill-opacity="0.35">
      <circle cx="400" cy="300" r="3.5"/><circle cx="480" cy="340" r="3"/>
      <circle cx="420" cy="400" r="3.2"/><circle cx="520" cy="300" r="2.8"/>
      <circle cx="450" cy="450" r="2.5"/><circle cx="550" cy="380" r="2.6"/>
      <circle cx="380" cy="360" r="2.4"/><circle cx="500" cy="420" r="2.2"/>
      <circle cx="440" cy="260" r="2"/><circle cx="560" cy="450" r="2.3"/>
      <circle cx="390" cy="480" r="2"/><circle cx="530" cy="500" r="1.8"/>
    </g>
    <!-- lighter salt/crumb flecks -->
    <g fill="#F5E0C8" fill-opacity="0.4">
      <circle cx="410" cy="280" r="1.8"/><circle cx="490" cy="310" r="1.5"/>
      <circle cx="460" cy="370" r="1.6"/><circle cx="540" cy="340" r="1.4"/>
      <circle cx="430" cy="420" r="1.5"/>
    </g>

    <!-- edge crispy lobes -->
    <path fill="#A34428" d="
      M 320 360 C 295 350 295 310 325 300 C 345 325 340 360 320 360 Z
      M 580 280 C 560 255 585 225 620 240 C 625 275 595 295 580 280 Z
      M 600 400 C 620 390 645 415 630 450 C 600 440 590 415 600 400 Z
      M 350 520 C 335 500 355 475 385 490 C 380 520 360 530 350 520 Z"/>
  </g>

  <!-- ========== CUT PIECE (front left) — white meat fibers exposed ========== -->
  <g>
    <!-- outer crust shell -->
    <path fill="url(#crustGold)" d="
      M 140 520
      C 100 450 120 370 180 330
      C 230 300 300 320 330 390
      C 360 460 320 540 250 570
      C 190 595 155 570 140 520
      Z"/>
    <!-- CUT FACE — cooked white/ivory meat (obvious chicken) -->
    <path fill="url(#meatInner)" d="
      M 175 400
      C 190 370 230 355 270 370
      C 300 385 310 430 290 470
      C 270 510 220 520 190 490
      C 165 465 160 430 175 400
      Z"/>
    <!-- radial muscle fibers on cut face -->
    <g fill="none" stroke="#C4A888" stroke-linecap="round" stroke-opacity="0.85">
      <path stroke-width="1.8" d="M200 410 C220 400 245 405 265 420"/>
      <path stroke-width="1.6" d="M195 430 C220 420 250 425 275 445"/>
      <path stroke-width="1.7" d="M198 450 C225 440 250 448 270 468"/>
      <path stroke-width="1.5" d="M205 470 C228 460 250 468 265 485"/>
      <path stroke-width="1.4" d="M210 400 C230 390 250 395 265 405"/>
      <path stroke-width="1.3" d="M215 485 C235 478 250 485 260 498"/>
    </g>
    <!-- deeper fiber shadows -->
    <g fill="none" stroke="#A88868" stroke-linecap="round" stroke-opacity="0.5">
      <path stroke-width="1.2" d="M205 420 C225 412 248 418 268 435"/>
      <path stroke-width="1.2" d="M200 445 C225 435 248 442 272 460"/>
      <path stroke-width="1.1" d="M210 465 C230 455 250 462 268 478"/>
    </g>
    <!-- moist sheen on cut -->
    <ellipse cx="230" cy="430" rx="28" ry="18" fill="#FFF8EC" fill-opacity="0.35"/>
    <!-- crust rim around cut -->
    <path fill="none" stroke="#8F3A24" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"
      d="M180 405 C195 375 235 360 275 375 C300 390 308 430 290 465"/>
    <!-- crust texture on outer -->
    <g fill="none" stroke="#4A1C0C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3">
      <path d="M160 450 C190 430 230 440 260 480"/>
      <path d="M155 490 C190 470 230 485 250 520"/>
    </g>
    <g fill="#5C2010" fill-opacity="0.3">
      <circle cx="180" cy="470" r="2.5"/><circle cx="210" cy="510" r="2"/><circle cx="160" cy="420" r="2.2"/>
    </g>
  </g>

  <!-- ========== SMALL WING / NUGGET (right, portion cue) ========== -->
  <g>
    <path fill="url(#crustGold)" d="
      M 620 480
      C 600 430 620 380 670 360
      C 650 350 680 330 720 345
      C 760 335 790 370 785 420
      C 780 470 740 510 690 520
      C 650 528 630 510 620 480
      Z"/>
    <path fill="#FFD4B0" fill-opacity="0.35" d="
      M 660 390 C 690 370 740 380 760 415 C 730 390 690 390 660 390 Z"/>
    <g fill="none" stroke="#4A1C0C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3">
      <path d="M650 420 C690 400 740 415 770 450"/>
      <path d="M640 450 C685 430 735 445 765 480"/>
    </g>
    <!-- tiny bone tip -->
    <path fill="url(#boneGrad)" d="
      M 770 470
      C 785 490 800 515 795 535
      C 790 550 770 550 760 535
      C 750 520 760 490 770 470
      Z"/>
    <ellipse cx="780" cy="535" rx="14" ry="10" fill="#EDE3D0"/>
    <ellipse cx="780" cy="535" rx="6" ry="4" fill="#FFF8EC"/>
  </g>

  </g><!-- end shadow group -->

  <!-- sauce drip / juice (appetite) -->
  <path fill="#C95530" d="
    M 520 600
    C 528 640 532 690 520 730
    C 514 700 514 650 520 600
    Z"/>
  <path fill="#A34428" d="
    M 555 610
    C 560 645 562 685 552 720
    C 548 690 550 650 555 610
    Z"/>
  <ellipse cx="522" cy="735" rx="10" ry="5" fill="#C95530" fill-opacity="0.6"/>

  <!-- herb garnish (fresh, quiet) -->
  <path fill="#667447" d="
    M 580 620
    C 600 585 650 595 640 640
    C 630 675 590 670 580 620
    Z"/>
  <path fill="#5A6B3C" d="
    M 620 640
    C 635 615 675 625 660 660
    C 650 685 620 675 620 640
    Z"/>
  <path fill="none" stroke="#4A5632" stroke-width="1.5" stroke-opacity="0.5"
    d="M600 610 L630 650 M640 630 L655 655"/>

  <!-- steam (fresh/hot) -->
  <g fill="none" stroke="#28211D" stroke-width="3" stroke-linecap="round" stroke-opacity="0.12">
    <path d="M380 140 C360 100 390 65 375 30"/>
    <path d="M440 125 C420 85 450 50 435 15"/>
    <path d="M500 140 C480 100 510 65 495 30"/>
  </g>
</svg>
