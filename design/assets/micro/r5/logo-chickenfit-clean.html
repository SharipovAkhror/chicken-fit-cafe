<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChickenFit Logo — Clean Draft</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Clash+Grotesk:wght@900&display=swap');
    
    body {
      background: #F8F4F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Clash Grotesk', sans-serif;
    }
    
    .logo {
      font-size: 142px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 14px;
      color: #28211D;
    }
    
    .chicken {
      color: #28211D;
    }
    
    .fit {
      color: #B94D2F;
      position: relative;
    }
    
    .fit::after {
      content: '';
      position: absolute;
      left: -7px;
      right: -7px;
      bottom: 9px;
      height: 14px;
      background: #B94D2F;
      opacity: 0.3;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="chicken">Chicken</span>
    <span class="fit">Fit</span>
  </div>
</body>
</html>
