<?xml version="1.0" encoding="UTF-8"?>
<!-- R5 Banner K1 variant: CHICKEN lettering + Fit -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" role="img" aria-label="Banner 2x1 K1 CHICKEN variant">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Manrope:wght@500;600&amp;display=swap');
      .fit { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 72px; }
      .strip-t { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 30px; fill: #28211D; }
      .kafe { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 22px; fill: #28211D; letter-spacing: 4px; }
    </style>
    <symbol id="ico-flame" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M14 4 C12 10 8 12 8 17 C8 21 10.5 24 14 24 C17.5 24 20 21 20 17 C20 12 16 10 14 4 Z"/>
    </symbol>
    <symbol id="ico-leaf" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M6 18 C6 10 12 5 22 6 C22 16 17 22 10 22 C8 22 6 20 6 18 Z"/>
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" d="M10 18 L18 10"/>
    </symbol>
    <symbol id="ico-bowl" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M5 12 H23 L21 20 C20 23 17.5 25 14 25 C10.5 25 8 23 7 20 Z"/>
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" d="M9 12 C10 8 12 7 14 7 C16 7 18 8 19 12"/>
    </symbol>
  </defs>

  <rect width="2000" height="1000" fill="#FFFFFF"/>

  <!-- food simplified -->
  <g transform="translate(80 120)">
    <path fill="#C95530" d="M200 400 C150 300 200 160 320 130 C440 100 540 180 560 300 C580 420 500 520 380 550 C280 575 230 490 200 400 Z"/>
    <path fill="#E07A52" d="M270 220 C320 170 420 165 490 230 C430 200 350 205 280 245 Z"/>
    <g fill="none" stroke="#6B2E1A" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3">
      <path d="M250 280 C320 250 420 265 500 310"/>
      <path d="M240 340 C320 305 420 320 500 370"/>
    </g>
    <path fill="#9A3D26" d="M120 380 C90 320 110 250 170 220 C220 195 270 220 285 280 C300 340 260 400 200 420 C150 435 130 410 120 380 Z"/>
  </g>

  <!-- K1 CHICKEN paths scaled -->
  <g fill="#28211D" transform="translate(980 280) skewX(-5) scale(1.35)">
    <path d="M78 8 C38 8 12 34 12 58 C12 82 38 108 78 108 L78 88 C50 88 32 76 32 58 C32 40 50 28 78 28 L78 8 M78 8 L96 8 L96 28 L78 28 Z M78 88 L96 88 L96 108 L78 108 Z"/>
    <path d="M112 8 L134 8 L134 48 L170 48 L170 8 L192 8 L192 108 L170 108 L170 66 L134 66 L134 108 L112 108 Z"/>
    <path d="M210 8 L248 8 L248 24 L236 24 L236 92 L248 92 L248 108 L210 108 L210 92 L222 92 L222 24 L210 24 Z"/>
    <path d="M318 8 C278 8 252 34 252 58 C252 82 278 108 318 108 L318 88 C290 88 272 76 272 58 C272 40 290 28 318 28 L318 8 M318 8 L336 8 L336 28 L318 28 Z M318 88 L336 88 L336 108 L318 108 Z"/>
    <path d="M352 8 L374 8 L374 50 L410 8 L438 8 L392 56 L442 108 L412 108 L374 64 L374 108 L352 108 Z"/>
    <path d="M458 8 L530 8 L530 26 L482 26 L482 48 L520 48 L520 64 L482 64 L482 90 L530 90 L530 108 L458 108 Z"/>
    <path d="M548 8 L574 8 L622 72 L622 8 L646 8 L646 108 L620 108 L572 42 L572 108 L548 108 Z"/>
  </g>
  <text x="1000" y="520" class="fit" fill="#C95530">Fit</text>
  <text x="1000" y="560" class="kafe">КАФЕ · SAMARKAND</text>

  <line x1="80" y1="780" x2="1920" y2="780" stroke="#28211D" stroke-opacity="0.08" stroke-width="2"/>
  <use href="#ico-flame" x="200" y="846" width="28" height="28"/>
  <text x="244" y="868" class="strip-t">сочная</text>
  <use href="#ico-leaf" x="520" y="846" width="28" height="28"/>
  <text x="564" y="868" class="strip-t">свежая</text>
  <use href="#ico-bowl" x="840" y="846" width="28" height="28"/>
  <text x="884" y="868" class="strip-t">сытная</text>
</svg>
