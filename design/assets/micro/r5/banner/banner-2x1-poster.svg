<?xml version="1.0" encoding="UTF-8"?>
<!--
  Facade poster 2×1 m — WHITE ground.
  Zone A: HERO chicken (obvious food — fibers, crust, bone). NOT mark language.
  Zone B: mark (cartoon OK) + T4 ChickenFit.
  Zone C: strip micro-icons aligned.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2000 1000" width="2000" height="1000" role="img"
     aria-label="ChickenFit facade poster 2x1 with hero chicken">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Manrope:wght@500;600&amp;display=swap');
      .brand { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; }
      .strip-t { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 30px; fill: #28211D; }
      .kafe { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 22px; fill: #28211D; letter-spacing: 4px; }
      .hint { font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; fill: #28211D; fill-opacity: 0.4; }
    </style>
    <symbol id="ico-flame" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M14 4 C12 10 8 12 8 17 C8 21 10.5 24 14 24 C17.5 24 20 21 20 17 C20 12 16 10 14 4 Z"/>
    </symbol>
    <symbol id="ico-leaf" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M6 18 C6 10 12 5 22 6 C22 16 17 22 10 22 C8 22 6 20 6 18 Z"/>
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" d="M10 18 L18 10"/>
    </symbol>
    <symbol id="ico-bowl" viewBox="0 0 28 28">
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M5 12 H23 L21 20 C20 23 17.5 25 14 25 C10.5 25 8 23 7 20 Z"/>
      <path fill="none" stroke="#C95530" stroke-width="2" stroke-linecap="round" d="M9 12 C10 8 12 7 14 7 C16 7 18 8 19 12"/>
    </symbol>
    <!-- simplified inline hero chicken (self-contained; full art in fa-hero-chicken.svg) -->
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A52"/><stop offset="40%" stop-color="#C95530"/>
      <stop offset="100%" stop-color="#8F3A24"/>
    </linearGradient>
    <linearGradient id="bgone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/><stop offset="100%" stop-color="#D8CBB4"/>
    </linearGradient>
    <linearGradient id="meat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D0"/><stop offset="100%" stop-color="#D4B896"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1000" fill="#FFFFFF"/>

  <!-- ===== ZONE A: HERO CHICKEN (~48% width) ===== -->
  <g transform="translate(40 40)">
    <!-- soft ground -->
    <ellipse cx="420" cy="700" rx="340" ry="50" fill="#EDE6DC"/>
    <ellipse cx="420" cy="688" rx="280" ry="34" fill="#F7F2EA"/>

    <!-- drum back + bone -->
    <path fill="#9A3D26" d="
      M 160 480 C 100 400 110 280 190 220 C 250 170 350 175 400 250
      C 440 310 435 410 390 500 C 345 580 220 575 160 480 Z"/>
    <g fill="none" stroke="#4A1C0C" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3">
      <path d="M200 300 C260 270 330 285 380 340"/>
      <path d="M190 370 C260 335 340 355 385 410"/>
      <path d="M200 440 C270 405 340 425 380 480"/>
    </g>
    <g fill="#5C2010" fill-opacity="0.28">
      <circle cx="250" cy="340" r="3"/><circle cx="300" cy="380" r="2.5"/>
      <circle cx="270" cy="430" r="2.8"/><circle cx="330" cy="320" r="2"/>
    </g>
    <!-- bone -->
    <path fill="url(#bgone)" d="M 370 490 C 390 540 405 600 398 650 C 392 690 355 705 335 680 C 315 655 335 580 360 530 Z"/>
    <ellipse cx="355" cy="675" rx="30" ry="20" fill="#EDE3D0"/>
    <ellipse cx="355" cy="675" rx="16" ry="10" fill="#FFF8EC"/>
    <ellipse cx="355" cy="675" rx="6" ry="4" fill="#D4C4A8"/>

    <!-- HERO thigh -->
    <path fill="url(#cg)" d="
      M 280 510 C 220 380 270 210 400 160 C 520 115 650 165 690 300
      C 730 430 660 560 530 610 C 420 655 320 610 280 510 Z"/>
    <path fill="#6B2810" fill-opacity="0.35" d="
      M 330 530 C 360 595 460 640 560 590 C 510 640 400 655 330 590 Z"/>
    <!-- juice sheen -->
    <ellipse cx="430" cy="280" rx="95" ry="55" fill="#FFD4B0" fill-opacity="0.4"/>
    <path fill="#FFD4B0" fill-opacity="0.35" d="
      M 370 220 C 430 165 550 170 620 245 C 550 200 450 200 380 250 Z"/>
    <!-- FIBERS — obvious chicken muscle -->
    <g fill="none" stroke="#5C2010" stroke-linecap="round">
      <path stroke-width="2.4" stroke-opacity="0.28" d="M330 300 C400 265 520 280 610 340"/>
      <path stroke-width="2.2" stroke-opacity="0.25" d="M320 350 C400 315 530 330 620 395"/>
      <path stroke-width="2.5" stroke-opacity="0.3" d="M325 400 C410 360 530 380 620 450"/>
      <path stroke-width="2.1" stroke-opacity="0.24" d="M340 450 C420 415 530 435 600 500"/>
      <path stroke-width="1.5" stroke-opacity="0.2" d="M340 325 C410 295 520 310 600 360"/>
      <path stroke-width="1.5" stroke-opacity="0.2" d="M335 375 C410 345 525 360 610 420"/>
      <path stroke-width="1.4" stroke-opacity="0.18" d="M350 250 C420 225 520 240 590 290"/>
    </g>
    <!-- crackle -->
    <g fill="none" stroke="#3A1508" stroke-linecap="round" stroke-opacity="0.3">
      <path stroke-width="3" d="M350 250 C430 215 550 235 640 300"/>
      <path stroke-width="2.6" d="M300 360 C400 315 540 340 650 420"/>
      <path stroke-width="2.4" d="M320 440 C420 395 540 420 630 500"/>
    </g>
    <!-- crumb flecks -->
    <g fill="#4A1C0C" fill-opacity="0.32">
      <circle cx="400" cy="310" r="3.5"/><circle cx="490" cy="350" r="3"/>
      <circle cx="430" cy="420" r="3.2"/><circle cx="540" cy="310" r="2.6"/>
      <circle cx="470" cy="470" r="2.4"/><circle cx="560" cy="400" r="2.5"/>
      <circle cx="380" cy="380" r="2.3"/><circle cx="510" cy="440" r="2"/>
    </g>
    <g fill="#F5E0C8" fill-opacity="0.4">
      <circle cx="420" cy="290" r="1.8"/><circle cx="500" cy="320" r="1.5"/>
      <circle cx="450" cy="380" r="1.6"/>
    </g>
    <!-- edge bumps -->
    <path fill="#A34428" d="
      M 300 360 C 275 348 275 305 310 295 C 330 325 320 365 300 360 Z
      M 600 290 C 580 260 610 230 645 250 C 650 285 615 305 600 290 Z
      M 630 420 C 655 408 680 440 660 475 C 625 460 615 435 630 420 Z"/>

    <!-- CUT PIECE with white meat fibers -->
    <path fill="#B84A2A" d="
      M 120 530 C 80 460 100 380 170 340 C 230 305 310 330 340 410
      C 370 490 320 570 240 595 C 170 615 135 580 120 530 Z"/>
    <path fill="url(#meat)" d="
      M 165 415 C 185 380 235 365 280 385 C 315 405 325 460 300 510
      C 275 555 215 565 180 530 C 150 500 145 450 165 415 Z"/>
    <!-- cut-face fibers -->
    <g fill="none" stroke="#B89870" stroke-linecap="round" stroke-opacity="0.9">
      <path stroke-width="1.8" d="M195 425 C220 412 250 420 275 440"/>
      <path stroke-width="1.7" d="M190 450 C220 438 255 448 280 470"/>
      <path stroke-width="1.7" d="M195 475 C225 462 255 475 275 498"/>
      <path stroke-width="1.5" d="M200 500 C225 490 250 500 270 520"/>
      <path stroke-width="1.4" d="M205 410 C230 400 255 408 275 420"/>
    </g>
    <g fill="none" stroke="#9A7858" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5">
      <path d="M200 437 C225 425 250 435 275 455"/>
      <path d="M198 462 C225 450 252 460 278 485"/>
    </g>
    <ellipse cx="230" cy="450" rx="26" ry="16" fill="#FFF8EC" fill-opacity="0.3"/>

    <!-- wing right + bone tip -->
    <path fill="#C95530" d="
      M 640 500 C 620 445 645 390 700 370 C 680 355 715 335 755 355
      C 800 345 835 385 828 445 C 820 505 770 550 710 555 C 665 560 650 535 640 500 Z"/>
    <g fill="none" stroke="#4A1C0C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.28">
      <path d="M670 430 C720 410 770 430 805 470"/>
      <path d="M660 470 C715 450 765 470 800 510"/>
    </g>
    <path fill="url(#bgone)" d="M 790 490 C 810 520 825 555 818 580 C 812 598 788 598 775 580 C 762 562 775 520 790 490 Z"/>
    <ellipse cx="800" cy="580" rx="16" ry="11" fill="#EDE3D0"/>
    <ellipse cx="800" cy="580" rx="7" ry="4.5" fill="#FFF8EC"/>

    <!-- juice drip -->
    <path fill="#C95530" d="M 520 620 C 528 670 532 720 518 760 C 512 720 512 665 520 620 Z"/>
    <!-- herb -->
    <path fill="#667447" d="M 600 640 C 620 605 670 615 655 660 C 645 690 605 685 600 640 Z"/>
  </g>

  <!-- ===== ZONE B: brand (mark cartoon OK + wordmark) ===== -->
  <g transform="translate(1020 200)">
    <!-- simple sandwich mark (logo language — cartoon OK) -->
    <g transform="scale(1.3)">
      <path fill="#C95530" d="M20 70 C20 84 34 94 56 94 C78 94 92 84 92 70 L92 78 C92 90 78 100 56 100 C34 100 20 90 20 78 Z"/>
      <path fill="#28211D" d="M26 54 C28 48 40 44 56 44 C72 44 84 48 86 54 L84 68 C82 72 70 76 56 76 C42 76 30 72 28 68 Z"/>
      <path fill="#C95530" d="M22 48 C22 26 36 14 56 14 C76 14 90 26 90 48 L90 52 C82 48 70 46 56 46 C42 46 30 48 22 52 Z"/>
      <ellipse cx="48" cy="32" rx="2.2" ry="1.3" fill="#FDFCF9" transform="rotate(-15 48 32)"/>
      <ellipse cx="64" cy="26" rx="2.3" ry="1.3" fill="#FDFCF9"/>
    </g>
    <text x="150" y="100" class="brand" font-size="96" letter-spacing="-2.5">
      <tspan fill="#28211D">Chicken</tspan><tspan fill="#C95530">Fit</tspan>
    </text>
    <text x="155" y="150" class="kafe">КАФЕ · SAMARKAND</text>
    <text x="155" y="190" class="hint">poster: hero chicken · logo: mark cartoon OK</text>
  </g>

  <!-- ===== ZONE C: strip ===== -->
  <line x1="80" y1="800" x2="1920" y2="800" stroke="#28211D" stroke-opacity="0.08" stroke-width="2"/>
  <use href="#ico-flame" x="200" y="860" width="28" height="28"/>
  <text x="244" y="882" class="strip-t">сочная</text>
  <use href="#ico-leaf" x="520" y="860" width="28" height="28"/>
  <text x="564" y="882" class="strip-t">свежая</text>
  <use href="#ico-bowl" x="840" y="860" width="28" height="28"/>
  <text x="884" y="882" class="strip-t">сытная</text>
</svg>
