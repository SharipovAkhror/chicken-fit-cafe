    C68 50 74 56 82 52
    C88 50 92 54 94 56
    L92 60
    C84 56 76 62 68 58
    C60 54 52 60 44 58
    C40 57 38 58 36 60
    Z"/>
  <!-- top bun dome -->
  <path fill="#C95530" d="
    M30 56
    C30 34 44 22 64 22
    C84 22 98 34 98 56
    L98 60
    C90 56 78 54 64 54
    C50 54 38 56 30 60
    Z"/>
  <!-- sesame -->
  <ellipse cx="48" cy="36" rx="2.6" ry="1.6" fill="#FDFCF9" transform="rotate(-20 48 36)"/>
  <ellipse cx="64" cy="30" rx="2.8" ry="1.6" fill="#FDFCF9"/>
  <ellipse cx="78" cy="38" rx="2.6" ry="1.6" fill="#FDFCF9" transform="rotate(18 78 38)"/>
  <!-- sauce drip appetite -->
  <path fill="#A34428" d="M76 78 C78 86 79 94 76 100 C74 94 74 86 76 78 Z"/>
</svg>
