<?xml version="1.0" encoding="UTF-8"?>
<!-- R5 m01 — chicken sandwich: bun + chicken slab readable at 32px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chicken sandwich mark">
  <rect width="128" height="128" rx="22" fill="#FDFCF9"/>
  <!-- bottom bun -->
  <path fill="#C95530" d="
    M28 78
    C28 92 42 102 64 102
    C86 102 100 92 100 78
    L100 86
    C100 98 86 108 64 108
    C42 108 28 98 28 86
    Z"/>
  <path fill="#A34428" d="
    M30 86
    C34 96 46 102 64 102
    C82 102 94 96 98 86
    C90 92 78 96 64 96
    C50 96 38 92 30 86
    Z"/>
