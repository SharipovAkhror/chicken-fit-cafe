  <path fill="#28211D" d="
    M34 62
    C36 56 48 52 64 52
    C80 52 92 56 94 62
    L92 76
    C90 80 78 84 64 84
    C50 84 38 80 36 76
    Z"/>
  <!-- fiber / muscle waves (drawn, not hatch grid) -->
  <path fill="none" stroke="#FDFCF9" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"
    d="M44 60 C52 58 76 58 84 61
       M42 67 C52 65 76 65 86 68
       M46 74 C56 72 72 72 82 74"/>
  <!-- leaf wave -->
  <path fill="#667447" fill-opacity="0.85" d="
