<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ChickenFit mark M1 Bite">
  <title>M1 — Разрез (bite)</title>
  <!-- Soft square canvas -->
  <rect width="128" height="128" rx="28" fill="#F3E7D3"/>
  <!-- Single product silhouette: rounded sandwich with internal layers as cutouts -->
  <g transform="translate(64 66)">
    <!-- Outer bun / shell -->
    <path fill="#B94D2F" d="
      M-34 -28
      C-34 -40 -22 -48 0 -48
      C22 -48 34 -40 34 -28
      L34 22
      C34 34 22 42 0 42
      C-22 42 -34 34 -34 22
      Z"/>
    <!-- Negative layer gaps (pastry reading) -->
    <path fill="#F3E7D3" d="M-24 -22 H24 V-14 H-24 Z"/>
    <path fill="#F3E7D3" d="M-24 -6 H24 V2 H-24 Z"/>
    <!-- Chicken core -->
    <ellipse cx="0" cy="14" rx="18" ry="8" fill="#28211D"/>
  </g>
</svg>
